apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: ${namespace}
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_ENVIRONMENT: "production"
  SERVER_PORT: "8082"

  # Broker da Saga: Service `rabbitmq`, implantado pelo pipeline do OS Service.
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # Deve ser igual ao issuer dos tokens emitidos pelo OS Service e pela Lambda.
  JWT_ISSUER: "mechanic-shop-api"

  # ---------- Observabilidade ----------
  NEW_RELIC_APP_NAME: "${newrelic_app_name}"
  NEW_RELIC_LABELS: "env:production;service:execution-service"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED: "true"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
