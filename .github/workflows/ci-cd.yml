name: Application CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube usa o historico para blame e codigo novo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Validate infrastructure on PRs
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      # Unitarios + BDD + integracao com MongoDB (Testcontainers); falha abaixo de 80% de linhas.
      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # Analise de qualidade com quality gate. Configure o secret SONAR_TOKEN e as variables
      # SONAR_PROJECT_KEY, SONAR_ORGANIZATION (SonarCloud) e, para SonarQube proprio, SONAR_HOST_URL.
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'mechanic-shop-execution-service' }}
        run: |
          args=(
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
          )
          if [ -n "$SONAR_ORGANIZATION" ]; then args+=(-Dsonar.organization="$SONAR_ORGANIZATION"); fi
          ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar "${args[@]}"

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: academy-execution-infrastructure
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'mechanic-shop-academy' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'mechanic-shop-academy' }}
      TF_VAR_atlas_org_id: ${{ vars.ATLAS_ORG_ID }}
      TF_VAR_atlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
      TF_VAR_atlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
      TF_VAR_db_password: ${{ secrets.MONGODB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify lab access, cluster and Atlas configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          status=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query 'cluster.status' --output text)
          test "$status" = ACTIVE || { echo "Shared cluster is $status, not ACTIVE. Run OS pipeline first." >&2; exit 1; }
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN JWT_SECRET RABBITMQ_USERNAME RABBITMQ_PASSWORD TF_VAR_atlas_org_id TF_VAR_atlas_public_key TF_VAR_atlas_private_key TF_VAR_db_password; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          test "$RABBITMQ_USERNAME" != guest || { echo 'RabbitMQ guest cannot connect from other pods' >&2; exit 1; }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - name: Initialize Execution state
        run: bash scripts/terraform-init.sh
      - name: Provision MongoDB Atlas M0
        run: |
          set -euo pipefail
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate
          terraform -chdir=terraform apply -auto-approve -input=false
          uri=$(terraform -chdir=terraform output -raw mongodb_uri)
          echo "::add-mask::$uri"
          echo "MONGODB_URI=$uri" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        run: |
          echo "app_image=${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-execution:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build -t "${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-execution:${GITHUB_SHA}" .
          docker push "${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-execution:${GITHUB_SHA}"
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Render and apply Kubernetes manifests
        env:
          namespace: mechanic-shop
          app_image: ${{ env.app_image }}
          app_replicas: '1'
          app_cpu_request: 250m
          app_cpu_limit: 1000m
          app_memory_request: 256Mi
          app_memory_limit: 512Mi
          hpa_min_replicas: '1'
          hpa_max_replicas: '5'
          hpa_cpu_average_utilization: '80'
          cluster_name: ${{ env.EKS_CLUSTER_NAME }}
          newrelic_app_name: ${{ vars.NEW_RELIC_APP_NAME || 'mechanic-shop-execution' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          set -euo pipefail
          kubectl get deployment rabbitmq -n "$namespace" >/dev/null
          kubectl get deployment kong -n "$namespace" >/dev/null
          kubectl get namespace "$namespace" >/dev/null
          render() { find "$@" -type f -name '*.yaml' -print0 | xargs -0 -I{} sh -c 'envsubst < "$1" | kubectl apply -f -' sh {}; }
          # O Secret vem antes do Deployment, para o pod nao subir sem credenciais.
          kubectl create secret generic execution-service-secret --namespace "$namespace" \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=RABBITMQ_USERNAME="$RABBITMQ_USERNAME" \
            --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Hash da configuracao: reinicia os pods quando so a configuracao muda (mesma imagem).
          export config_checksum=$( { for f in k8s/01-config/*.yaml; do envsubst < "$f"; done; kubectl get secret execution-service-secret --namespace "$namespace" -o jsonpath='{.data}'; } | sha256sum | cut -c1-16)
          render k8s/01-config k8s/03-app
          kubectl rollout status deployment/execution-service --namespace "$namespace" --timeout=5m
